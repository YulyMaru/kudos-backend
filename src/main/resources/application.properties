spring.application.name=kudos
server.port=${PORT:8080}
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kudos}
spring.datasource.username=${DB_USUARIO:kudos}
spring.datasource.password=${DB_CONTRASENA:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAXIMO:5}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.cache.cache-names=categorias-activas
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.metrics.tags.application=${spring.application.name}
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.tracing.sampling.probability=${TRAZAS_MUESTREO:0.1}
management.tracing.export.otlp.enabled=${OTLP_TRAZAS_HABILITADAS:false}
management.otlp.metrics.export.enabled=${OTLP_METRICAS_HABILITADAS:false}
management.otlp.metrics.export.url=${OTLP_METRICAS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=1m

spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PUERTO:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

kudos.notificaciones.correo.remitente=${CORREO_REMITENTE:no-responder@uco-kudos.app}
kudos.notificaciones.correo.nombre-remitente=${CORREO_NOMBRE_REMITENTE:UCO Kudos}
kudos.notificaciones.correo.url-frontend=${URL_FRONTEND:http://localhost:4200}

kudos.notificaciones.whatsapp.url-api=${WHATSAPP_URL_API:https://graph.facebook.com/v23.0}
kudos.notificaciones.whatsapp.token=${WHATSAPP_TOKEN:}
kudos.notificaciones.whatsapp.telefono-id=${WHATSAPP_TELEFONO_ID:}
kudos.notificaciones.whatsapp.plantilla=${WHATSAPP_PLANTILLA:kudo_recibido}
kudos.notificaciones.whatsapp.idioma=${WHATSAPP_IDIOMA:es}
kudos.notificaciones.whatsapp.plantilla-codigo=${WHATSAPP_PLANTILLA_CODIGO:codigo_verificacion}

kudos.registro.dominios-institucionales=${REGISTRO_DOMINIOS:uco.edu.co}
kudos.registro.vigencia-codigos=PT15M
kudos.registro.vigencia-restablecimiento=PT30M

kudos.limpieza.habilitada=${LIMPIEZA_HABILITADA:true}
kudos.limpieza.cron=0 30 3 * * *
kudos.limpieza.retencion-notificaciones=P30D
kudos.limpieza.retencion-credenciales=P1D

kudos.outbox.habilitado=${OUTBOX_HABILITADO:true}
kudos.outbox.intervalo=${OUTBOX_INTERVALO:PT5S}
kudos.outbox.retraso-inicial=PT10S
kudos.outbox.tamano-lote=20
kudos.outbox.maximo-intentos=5
kudos.outbox.retraso-base=PT10S
kudos.outbox.retraso-maximo=PT10M
kudos.outbox.duracion-reserva=PT2M

kudos.seguridad.jwt-secreto=${JWT_SECRETO:}
kudos.seguridad.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}
kudos.seguridad.emisor-jwt=uco-kudos
kudos.seguridad.duracion-token-acceso=${JWT_DURACION_ACCESO:PT15M}
kudos.seguridad.duracion-token-refresco=${JWT_DURACION_REFRESCO:P7D}
kudos.seguridad.maximo-intentos-fallidos=5
kudos.seguridad.duracion-bloqueo=PT15M
kudos.seguridad.costo-bcrypt=12

kudos.administrador-inicial.nombre=${ADMIN_NOMBRE:Administrador UCO Kudos}
kudos.administrador-inicial.correo=${ADMIN_CORREO:}
kudos.administrador-inicial.contrasena=${ADMIN_CONTRASENA:}

kudos.demostracion.habilitada=${DEMO_HABILITADA:false}

kudos.almacenamiento.tipo=${ALMACENAMIENTO_TIPO:local}
kudos.almacenamiento.directorio=${ALMACENAMIENTO_DIRECTORIO:almacenamiento-local}
kudos.almacenamiento.endpoint=${S3_ENDPOINT:}
kudos.almacenamiento.region=${S3_REGION:us-east-1}
kudos.almacenamiento.bucket=${S3_BUCKET:kudos-adjuntos}
kudos.almacenamiento.clave-acceso=${S3_CLAVE_ACCESO:}
kudos.almacenamiento.clave-secreta=${S3_CLAVE_SECRETA:}
kudos.almacenamiento.vigencia-enlaces=${S3_VIGENCIA_ENLACES:PT10M}
